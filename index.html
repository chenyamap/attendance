<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>课堂签到</title>
<style>
:root{
  --bg:#f6f8fc;--panel:#fff;--text:#182033;--muted:#8a93a6;--line:#e8ecf4;
  --primary:#5867f5;--primary2:#7b84ff;--danger:#ef5966;--success:#20a76b;
  --warning:#f2a33a;--shadow:0 14px 40px rgba(30,40,75,.07);--radius:22px
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}
aside{background:#12182a;padding:26px 16px;color:#fff}
.brand{font-size:20px;font-weight:800;padding:4px 12px 26px}
.nav{display:flex;flex-direction:column;gap:7px}
.nav button{border:0;background:transparent;color:#aeb7cb;padding:13px 14px;border-radius:13px;text-align:left;cursor:pointer}
.nav button.active,.nav button:hover{background:#202943;color:#fff}
main{padding:30px}.page{display:none}.page.active{display:block}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
h1{margin:0;font-size:28px}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat-label{color:var(--muted);font-size:14px}.stat-num{font-size:34px;font-weight:800;margin-top:8px}
.btn{border:0;border-radius:13px;padding:11px 18px;font-weight:750;cursor:pointer;transition:.18s}
.btn:hover{transform:translateY(-1px)}.primary{background:var(--primary);color:#fff}.danger{background:#ffedf0;color:var(--danger)}.ghost{background:#f1f3f7;color:#525b6f}
.toolbar{display:flex;gap:10px;flex-wrap:wrap}
.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.course-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.course-card h3{margin:0 0 8px}.course-meta{color:var(--muted);font-size:14px}
.field label{display:block;color:#6d7689;font-size:13px;margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px 13px;outline:none}
.field textarea{min-height:300px;resize:vertical;line-height:1.7}
.name-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}
.name-chip{background:#f7f8fc;border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center;font-size:14px}

.checkin-layout{display:grid;grid-template-columns:390px 1fr;gap:18px;align-items:start}
.checkin-card{text-align:center}
.control-row{display:grid;grid-template-columns:1fr 120px;gap:10px;text-align:left}
.qr-wrap{width:300px;height:300px;margin:20px auto 10px;border-radius:24px;background:#fafbfe;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:16px}
.qr-wrap img{width:268px;height:268px;object-fit:contain;display:none}
.countdown{font-weight:800;font-size:21px;color:var(--primary);margin-top:6px}

.live-top{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.live-stat{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}
.live-stat .k{font-size:13px;color:var(--muted);margin-bottom:7px}
.live-stat .v{font-size:28px;font-weight:850}
.live-stat.good .v{color:var(--success)}.live-stat.bad .v{color:var(--danger)}.live-stat.rate .v{color:var(--primary)}

.progress-wrap{margin:4px 0 18px}
.progress-bar{height:12px;background:#edf0f6;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:width .35s ease}
.progress-text{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:7px}

.list-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.list-card{border:1px solid var(--line);border-radius:18px;padding:16px;min-height:320px;background:#fff}
.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.list-head h3{margin:0;font-size:17px}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:800}
.pill.green{background:#e8f8f0;color:#168a56}.pill.red{background:#ffedf0;color:#d94654}
.signed-row{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line)}
.signed-name{font-weight:750}.signed-time{font-size:12px;color:var(--muted)}
.absent-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.absent-chip{padding:10px;border-radius:11px;background:#f7f8fc;border:1px solid var(--line);text-align:center;font-size:14px}
.empty{color:#a0a8b8;padding:28px 0;text-align:center}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.table th{color:#7a8395}

.session-course{font-size:13px;color:var(--muted);margin-bottom:12px}
.live-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--success);font-weight:700}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px rgba(32,167,107,.12)}

.student-shell{max-width:520px;margin:0 auto;padding:30px 18px}
.student-title{text-align:center;margin:12px 0 18px}
.mobile-card{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:22px}
.student-status{background:#f2f4ff;color:#4b58cf;border-radius:13px;padding:12px 14px;text-align:center;margin-bottom:16px}
.success{background:#e9f8f1;color:#148652}

@media(max-width:1100px){
  .checkin-layout{grid-template-columns:1fr}
}
@media(max-width:950px){
  .app{grid-template-columns:1fr}aside{display:none}main{padding:16px}
  .stats,.course-grid{grid-template-columns:1fr}
  .control-row{grid-template-columns:1fr}
  .name-grid{grid-template-columns:repeat(2,1fr)}
  .live-top{grid-template-columns:repeat(2,1fr)}
  .list-grid{grid-template-columns:1fr}
  .qr-wrap{width:100%;max-width:300px}
}
</style>
</head>
<body>
<div id="teacherApp" class="app">
<aside>
  <div class="brand">课堂签到</div>
  <div class="nav">
    <button class="active" data-page="home">首页</button>
    <button data-page="courses">课程</button>
    <button data-page="students">学生名单</button>
    <button data-page="checkin">开始签到</button>
    <button data-page="records">签到记录</button>
  </div>
</aside>

<main>
<section id="home" class="page active">
  <div class="page-head"><h1>首页</h1></div>
  <div class="stats">
    <div class="card"><div class="stat-label">课程</div><div id="courseCount" class="stat-num">0</div></div>
    <div class="card"><div class="stat-label">学生</div><div id="studentCount" class="stat-num">0</div></div>
    <div class="card"><div class="stat-label">签到记录</div><div id="recordCount" class="stat-num">0</div></div>
  </div>
</section>

<section id="courses" class="page">
  <div class="page-head"><h1>课程</h1><button class="btn primary" onclick="addCourse()">+ 新建课程</button></div>
  <div id="courseGrid" class="course-grid"></div>
</section>

<section id="students" class="page">
  <div class="page-head"><h1>学生名单</h1></div>
  <div class="card">
    <div class="field"><label>课程</label><select id="studentCourse" onchange="loadNames()"></select></div>
    <div class="field" style="margin-top:14px"><label>学生姓名</label><textarea id="names" placeholder="张三&#10;李四&#10;王五"></textarea></div>
    <div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="saveNames()">保存名单</button><button class="btn ghost" onclick="clearNames()">清空</button></div>
    <div id="nameGrid" class="name-grid"></div>
  </div>
</section>

<section id="checkin" class="page">
  <div class="page-head">
    <h1>课堂签到</h1>
    <div id="liveStatus" class="live-badge"><span class="live-dot"></span>等待开始</div>
  </div>

  <div class="checkin-layout">
    <div class="card checkin-card">
      <div class="control-row">
        <div class="field"><label>课程</label><select id="checkinCourse" onchange="renderSessionStats()"></select></div>
        <div class="field"><label>刷新</label><select id="refreshSec"><option value="30">30 秒</option><option value="45">45 秒</option><option value="60" selected>60 秒</option></select></div>
      </div>
      <div class="toolbar" style="justify-content:center;margin-top:16px">
        <button class="btn primary" onclick="startCheckin()">开始签到</button>
        <button class="btn danger" onclick="stopCheckin()">结束签到</button>
      </div>
      <div class="qr-wrap"><div id="qrPlaceholder">点击“开始签到”</div><img id="qrImage"></div>
      <div id="countdown" class="countdown">未开始</div>
    </div>

    <div>
      <div class="live-top">
        <div class="live-stat"><div class="k">应到</div><div class="v" id="totalNow">0</div></div>
        <div class="live-stat good"><div class="k">已到</div><div class="v" id="signedNow">0</div></div>
        <div class="live-stat bad"><div class="k">未到</div><div class="v" id="absentNow">0</div></div>
        <div class="live-stat rate"><div class="k">到课率</div><div class="v" id="rateNow">0%</div></div>
      </div>

      <div class="card">
        <div class="session-course" id="sessionCourseText">请选择课程并开始签到</div>
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-text"><span id="progressLabel">0 / 0</span><span id="progressRate">0%</span></div>
        </div>

        <div class="list-grid">
          <div class="list-card">
            <div class="list-head"><h3>已签到</h3><span class="pill green" id="signedBadge">0</span></div>
            <div id="signedList"><div class="empty">暂无签到</div></div>
          </div>

          <div class="list-card">
            <div class="list-head"><h3>未签到</h3><span class="pill red" id="absentBadge">0</span></div>
            <div id="absentList"><div class="empty">暂无学生</div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="records" class="page">
  <div class="page-head"><h1>签到记录</h1></div>
  <div class="card">
    <table class="table"><thead><tr><th>课程</th><th>姓名</th><th>时间</th></tr></thead><tbody id="recordBody"></tbody></table>
  </div>
</section>
</main>
</div>

<div id="studentApp" style="display:none">
  <div class="student-shell">
    <h1 class="student-title">课堂签到</h1>
    <div class="mobile-card">
      <div id="studentNotice" class="student-status">正在验证二维码</div>
      <div class="field"><label>姓名</label><select id="studentName"></select></div>
      <button id="submitBtn" class="btn primary" style="width:100%;margin-top:16px" onclick="studentSubmit()">确认签到</button>
    </div>
  </div>
</div>

<script>
const K={courses:'rt2_courses',students:'rt2_students'};
let courses=JSON.parse(localStorage.getItem(K.courses)||'null')||[
  {id:'c1',name:'交互设计'},{id:'c2',name:'创新设计前沿'},{id:'c3',name:'视听语言'}
];
let students=JSON.parse(localStorage.getItem(K.students)||'[]');
let cfg={url:'https://xvfkkyrztowplefcqddd.supabase.co',key:'sb_publishable_fAIe_c0_aQQ0EWvRBswjIw_g5xOb2m2'};
let activeSession=null,timer=null,pollTimer=null,cloudRecords=[];

function saveLocal(){localStorage.setItem(K.courses,JSON.stringify(courses));localStorage.setItem(K.students,JSON.stringify(students))}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rand(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function encodeNames(a){return btoa(unescape(encodeURIComponent(JSON.stringify(a))))}
function decodeNames(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return[]}}

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(b.dataset.page).classList.add('active');
  render();
});

function addCourse(){
  const n=prompt('课程名称');if(!n?.trim())return;
  courses.push({id:'c'+Date.now(),name:n.trim()});saveLocal();render();
}
function removeCourse(id){
  if(!confirm('删除这个课程？'))return;
  courses=courses.filter(x=>x.id!==id);students=students.filter(x=>x.courseId!==id);saveLocal();render();
}
function renderCourses(){
  courseGrid.innerHTML=courses.map(c=>`<div class="course-card"><h3>${esc(c.name)}</h3><div class="course-meta">${students.filter(s=>s.courseId===c.id).length} 名学生</div><button class="btn danger" style="margin-top:14px" onclick="removeCourse('${c.id}')">删除</button></div>`).join('');
}
function fillSelects(){
  [studentCourse,checkinCourse].forEach(el=>{
    const old=el.value;
    el.innerHTML=courses.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
    if([...el.options].some(x=>x.value===old))el.value=old;
  });
}
function parseNames(t){return [...new Set(t.split(/[\r\n,，、;；\t ]+/).map(x=>x.trim()).filter(Boolean))]}
function loadNames(){
  if(!studentCourse.value)return;
  const a=students.filter(s=>s.courseId===studentCourse.value).map(s=>s.name);
  names.value=a.join('\n');nameGrid.innerHTML=a.map(n=>`<div class="name-chip">${esc(n)}</div>`).join('');
}
function saveNames(){
  const cid=studentCourse.value,a=parseNames(names.value);
  students=students.filter(s=>s.courseId!==cid);
  a.forEach((n,i)=>students.push({id:'s'+Date.now()+i,courseId:cid,name:n}));
  saveLocal();render();loadNames();
}
function clearNames(){
  if(!confirm('清空当前名单？'))return;
  students=students.filter(s=>s.courseId!==studentCourse.value);saveLocal();render();loadNames();
}

function headers(){return {'apikey':cfg.key,'Authorization':'Bearer '+cfg.key,'Content-Type':'application/json','Prefer':'return=representation'}}
async function api(path,opts={}){
  const r=await fetch(cfg.url+'/rest/v1/'+path,{...opts,headers:{...headers(),...(opts.headers||{})}});
  if(!r.ok)throw new Error(await r.text());
  const t=await r.text();return t?JSON.parse(t):null;
}

function makeStudentUrl(){
  const u=new URL(location.href);u.search='';u.hash='';
  u.searchParams.set('student','1');
  u.searchParams.set('course',activeSession.courseName);
  u.searchParams.set('sid',activeSession.sid);
  u.searchParams.set('token',activeSession.token);
  u.searchParams.set('expires',activeSession.expires);
  u.searchParams.set('names',encodeNames(activeSession.names));
  return u.toString();
}
async function refreshQR(){
  activeSession.token=rand();activeSession.expires=Date.now()+activeSession.refresh*1000;
  const url=makeStudentUrl();
  qrPlaceholder.style.display='none';qrImage.style.display='block';
  qrImage.src='https://quickchart.io/qr?size=500&margin=2&text='+encodeURIComponent(url)+'&_='+Date.now();
}
async function startCheckin(){
  const cid=checkinCourse.value,c=courses.find(x=>x.id===cid),arr=students.filter(s=>s.courseId===cid).map(s=>s.name);
  if(!arr.length)return alert('请先添加学生名单');
  activeSession={sid:'sess'+Date.now(),courseId:cid,courseName:c.name,names:arr,refresh:+refreshSec.value,token:'',expires:0};
  await refreshQR();
  clearInterval(timer);timer=setInterval(tick,1000);
  clearInterval(pollTimer);pollTimer=setInterval(fetchRecords,2000);
  liveStatus.innerHTML='<span class="live-dot"></span>签到进行中';
  await fetchRecords();tick();renderSessionStats();
}
function tick(){
  if(!activeSession)return;
  const l=Math.max(0,Math.ceil((activeSession.expires-Date.now())/1000));
  countdown.textContent=l+' 秒后刷新';
  if(l<=0)refreshQR();
}
function stopCheckin(){
  activeSession=null;clearInterval(timer);clearInterval(pollTimer);
  qrImage.style.display='none';qrPlaceholder.style.display='block';qrPlaceholder.textContent='签到已结束';countdown.textContent='已结束';
  liveStatus.innerHTML='<span class="live-dot"></span>签到已结束';
  renderSessionStats();
}

async function fetchRecords(){
  try{
    cloudRecords=await api('attendance_records?select=*&order=created_at.desc');
    renderRecords();renderSessionStats();
  }catch(e){console.error(e)}
}

function renderSessionStats(){
  const cid=activeSession?activeSession.courseId:checkinCourse.value;
  const course=courses.find(c=>c.id===cid);
  const roster=students.filter(s=>s.courseId===cid).map(s=>s.name);
  const live=activeSession?cloudRecords.filter(r=>r.session_id===activeSession.sid):[];
  const signedNames=[...new Set(live.map(r=>r.student_name))];
  const absent=roster.filter(n=>!signedNames.includes(n));
  const total=roster.length,signed=signedNames.length,absentCount=Math.max(0,total-signed);
  const rate=total?Math.round(signed/total*100):0;

  totalNow.textContent=total;
  signedNow.textContent=signed;
  absentNow.textContent=absentCount;
  rateNow.textContent=rate+'%';
  signedBadge.textContent=signed;
  absentBadge.textContent=absentCount;
  progressFill.style.width=rate+'%';
  progressLabel.textContent=signed+' / '+total;
  progressRate.textContent=rate+'%';
  sessionCourseText.textContent=activeSession?(activeSession.courseName+' · 本场签到'):(course?course.name+' · 尚未开始':'请选择课程');

  signedList.innerHTML=live.length?live.map(r=>`<div class="signed-row"><span class="signed-name">${esc(r.student_name)}</span><span class="signed-time">${new Date(r.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span></div>`).join(''):'<div class="empty">暂无签到</div>';
  absentList.innerHTML=absent.length?`<div class="absent-grid">${absent.map(n=>`<div class="absent-chip">${esc(n)}</div>`).join('')}</div>`:'<div class="empty">全员已到</div>';
}

function renderRecords(){
  recordBody.innerHTML=cloudRecords.length?cloudRecords.map(r=>`<tr><td>${esc(r.course_name)}</td><td>${esc(r.student_name)}</td><td>${new Date(r.created_at).toLocaleString()}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">暂无记录</td></tr>';
  recordCount.textContent=cloudRecords.length;
}
function render(){
  fillSelects();renderCourses();loadNames();renderRecords();renderSessionStats();
  courseCount.textContent=courses.length;studentCount.textContent=students.length;
}

function initStudent(){
  const q=new URLSearchParams(location.search);if(q.get('student')!=='1')return false;
  teacherApp.style.display='none';studentApp.style.display='block';
  const expires=Number(q.get('expires')||0),sid=q.get('sid'),course=q.get('course')||'课堂签到',list=decodeNames(q.get('names')||'');
  window.studentSession={expires,sid,course};
  studentName.innerHTML='<option value="">请选择姓名</option>'+list.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
  if(Date.now()>expires){studentNotice.textContent='二维码已过期';submitBtn.disabled=true;submitBtn.style.opacity=.5}
  else studentNotice.textContent='请选择姓名';
  return true;
}
async function studentSubmit(){
  const s=window.studentSession;if(!s||Date.now()>s.expires)return alert('二维码已过期，请重新扫码');
  const name=studentName.value;if(!name)return alert('请选择姓名');
  try{
    const exist=await api(`attendance_records?session_id=eq.${encodeURIComponent(s.sid)}&student_name=eq.${encodeURIComponent(name)}&select=id`);
    if(exist.length)return alert('已签到');
    await api('attendance_records',{method:'POST',body:JSON.stringify({session_id:s.sid,course_name:s.course,student_name:name})});
    studentNotice.textContent='签到成功';studentNotice.classList.add('success');submitBtn.disabled=true;submitBtn.style.opacity=.5;
  }catch(e){alert('签到失败：'+e.message)}
}

if(!initStudent()){
  render();
  fetchRecords();
  setInterval(()=>{if(!activeSession)fetchRecords()},5000);
}
</script>
</body>
</html>
